@if (cargando()) {
  <p class="estado">Cargando editor...</p>
} @else if (error() && !proyecto()) {
  <p class="error">{{ error() }}</p>
} @else if (proyecto(); as p) {
  <div class="editor-layout">
    <app-toolbar
      [conectado]="canvasService.conectado()"
      [puedeEditar]="puedeEditar()"
      [proyectoId]="proyectoId"
      [guardandoVersion]="guardandoVersion()"
      [puedeDeshacer]="canvasService.puedeDeshacer()"
      [exportandoXmi]="exportandoXmi()"
      [exportandoXmiEa]="exportandoXmiEa()"
      (centrar)="centrar()"
      (guardarVersion)="guardarVersion()"
      (deshacer)="canvasService.deshacer()"
      (exportarXmi)="exportarXmi()"
      (exportarXmiEa)="exportarXmiEa()"
    />

    @if (error()) {
      <p class="error flotante">{{ error() }}</p>
    }

    <div class="editor-medio">
      <app-toolbox
        [modo]="modo()"
        [puedeEditar]="puedeEditar()"
        (cambiarModo)="cambiarModo($event)"
        (alinear)="alinear()"
      />

      <app-canvas-board
        [lienzo]="canvasService.lienzo()"
        [soloLectura]="!puedeEditar()"
        [modo]="modo()"
        [cursores]="canvasService.cursores()"
        (claseSeleccionada)="alClaseSeleccionada($event)"
        (relacionSeleccionada)="alRelacionSeleccionada($event)"
        (claseMovida)="alClaseMovida($event)"
        (relacionPropuesta)="alRelacionPropuesta($event)"
        (crearClaseSolicitada)="alCrearClaseEnPosicion($event)"
        (cursorMovido)="canvasService.moverCursor($event.x, $event.y)"
      />

      <app-collaboration-panel [proyectoId]="proyectoId" />
    </div>

    @if (claseSeleccionada(); as clase) {
      <app-class-panel [clase]="clase" [soloLectura]="!puedeEditar()" (cerrar)="alClaseSeleccionada(null)" />
    }
  </div>

  <app-relation-form
    [abierto]="mostrarRelationForm()"
    [origenId]="origenPendiente()"
    [destinoId]="destinoPendiente()"
    [relacion]="relacionEditando()"
    [clases]="canvasService.lienzo()?.clases ?? {}"
    [tipoInicial]="tipoRelacionPropuesta()"
    (cerrado)="cerrarRelationForm()"
  />
}
