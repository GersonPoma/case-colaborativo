<div class="toolbar">
  <a class="volver" [routerLink]="['/proyectos', proyectoId()]">← Volver</a>

  @if (puedeEditar()) {
    <button
      type="button"
      class="boton-herramienta"
      [disabled]="!puedeDeshacer()"
      title="Ctrl+Z (deshace solo tus últimos cambios)"
      (click)="deshacer.emit()"
    >
      ↶ Deshacer
    </button>
  } @else {
    <span class="solo-lectura">Solo lectura</span>
  }

  <button type="button" class="boton-herramienta" (click)="centrar.emit()">Centrar</button>

  <span class="separador"></span>

  <span class="estado-conexion" [class.conectado]="conectado()">
    {{ conectado() ? '● En vivo' : '○ Conectando…' }}
  </span>

  <button
    type="button"
    class="boton-herramienta"
    [disabled]="exportandoXmi()"
    (click)="exportarXmi.emit()"
    title="Descarga el diagrama en formato XMI estándar para abrirlo en otras herramientas UML"
  >
    {{ exportandoXmi() ? 'Exportando...' : 'Exportar XMI' }}
  </button>

  <button
    type="button"
    class="boton-herramienta"
    [disabled]="exportandoXmiEa()"
    (click)="exportarXmiEa.emit()"
    title="Descarga el diagrama en un XMI con el diagrama ya dibujado, pensado para Enterprise Architect"
  >
    {{ exportandoXmiEa() ? 'Exportando...' : 'Exportar a EA' }}
  </button>

  <button
    type="button"
    class="boton-herramienta"
    [disabled]="exportandoImagen()"
    (click)="exportarImagen.emit()"
    title="Descarga el diagrama como imagen PNG"
  >
    {{ exportandoImagen() ? 'Exportando...' : 'Exportar imagen' }}
  </button>

  <button
    type="button"
    class="boton-herramienta"
    [disabled]="generandoBackend()"
    (click)="generarBackend.emit()"
    title="Genera un proyecto Spring Boot a partir de este diagrama"
  >
    {{ generandoBackend() ? 'Generando...' : 'Generar Backend' }}
  </button>

  @if (puedeEditar()) {
    <button
      type="button"
      class="boton-herramienta"
      [disabled]="importandoXmi()"
      (click)="inputArchivo.click()"
      title="Importa un archivo XMI (reemplaza todo el lienzo actual)"
    >
      {{ importandoXmi() ? 'Importando...' : 'Importar XMI' }}
    </button>
    <input #inputArchivo type="file" accept=".xmi,.xml" hidden (change)="alSeleccionarArchivo($event)" />

    <button
      type="button"
      class="boton-herramienta"
      [disabled]="importandoIa()"
      (click)="inputArchivoIa.click()"
      title="Genera el diagrama a partir de una foto o captura de un diagrama de clases (reemplaza todo el lienzo actual)"
    >
      {{ importandoIa() ? 'Analizando...' : 'Foto a diagrama' }}
    </button>
    <input
      #inputArchivoIa
      type="file"
      accept="image/png,image/jpeg,image/webp"
      hidden
      (change)="alSeleccionarArchivoIa($event)"
    />
  }

  @if (puedeEditar()) {
    <span class="autoguardado" title="Cada cambio se guarda solo, al instante">Autoguardado</span>

    <button
      type="button"
      class="boton-primario-sm"
      [disabled]="guardandoVersion()"
      (click)="guardarVersion.emit()"
      title="Crea un punto del historial para volver a él más adelante"
    >
      {{ guardandoVersion() ? 'Guardando...' : 'Guardar versión' }}
    </button>
  }
</div>
