<div class="login-page">
  <form class="login-card" [formGroup]="formulario" (ngSubmit)="enviar()">
    <h1>Iniciar sesión</h1>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <label for="username">Usuario</label>
    <input id="username" type="text" formControlName="username" autocomplete="username" />

    <label for="password">Contraseña</label>
    <div class="password-field">
      <input
        id="password"
        [type]="mostrarPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="toggle-password"
        (click)="alternarMostrarPassword()"
        [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (mostrarPassword()) {
          <svg lucideEyeOff [size]="18"></svg>
        } @else {
          <svg lucideEye [size]="18"></svg>
        }
      </button>
    </div>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <div class="links">
      <a routerLink="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>
      <a routerLink="/registro">Crear cuenta</a>
    </div>
  </form>
</div>
